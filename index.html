<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeux anniversaire Achabi ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff4b6e,#ff9a9e);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:white;
}

.card{
    background:rgba(255,255,255,0.15);
    padding:30px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    width:90%;
    max-width:500px;
}

h1{
    font-size:2.2em;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:white;
    color:#ff4b6e;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#secret{
    display:none;
    margin-top:20px;
    font-size:20px;
}
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Joyeux anniversaire Achabi ❤️</h1>
    <p>J'ai une surprise pour toi...</p>

    <button onclick="document.getElementById('secret').style.display='block'">
        Ouvrir la surprise 💝
    </button>

    <div id="secret">
        <p>
        Mon amour ❤️<br><br>
        Je te souhaite un merveilleux anniversaire.
        Merci d'être dans ma vie.
        J'espère que cette journée sera remplie de bonheur et de sourires.
        Je t'aime énormément. ❤️
        </p>
    </div>
</div>

</body>
</html>
